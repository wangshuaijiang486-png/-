<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留言栏 · 我的小天地</title><link rel="stylesheet" href="local.css"></head><body class="detail-page"><header><a class="brand" href="index.html">← 返回森林主页</a></header><main><section class="message-panel"><h1>树上的小信箱</h1><p>路过这里，留下一句话吧。<br>当前留言仅保存在此浏览器中，还不会公开给其他访客。</p><form class="message-form" id="message-form"><label for="nickname">称谓</label><input id="nickname" maxlength="30" placeholder="路过的旅人"><label for="contact">联系方式</label><input id="contact" name="contact" maxlength="120" placeholder="邮箱、微信或其他联系方式（选填）"><label for="message">留言</label><textarea id="message" maxlength="2000" required placeholder="分享一个想法，或是打个招呼……"></textarea><button type="submit">投递留言 ✉</button></form><p id="message-status" role="status"></p><div id="message-list"></div></section></main><script src="messages.js"></script></body></html>
